name: Build

# Build and test the exe for each pull request to main. To block merging
# when this fails, make "Build and test (x64)" a required status check for
# main in the repository settings.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.bat

      - name: Test
        shell: pwsh
        run: ./test/smoke.ps1 build/playsound.exe

      - name: Measure start-up time
        shell: pwsh
        run: ./test/measure.ps1 -Exe build/playsound.exe -NoSound -Count 21

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: playsound-x64
          path: build/playsound.exe
          if-no-files-found: error
