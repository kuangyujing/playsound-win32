name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Test
        shell: pwsh
        run: ./test/smoke.ps1 build/playsound.exe

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: playsound-x64
          path: build/playsound.exe
          if-no-files-found: error

  # When a tag that starts with "v" is pushed (for example v1.0.0), make a
  # GitHub release with a zip file of the exe, LICENSE, and README.md.
  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download exe
        uses: actions/download-artifact@v8
        with:
          name: playsound-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -j "playsound-$TAG-x64.zip" dist/playsound.exe LICENSE README.md
          sha256sum "playsound-$TAG-x64.zip" > SHA256SUMS.txt
          gh release create "$TAG" "playsound-$TAG-x64.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
